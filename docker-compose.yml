x-environment: &common-env
  IQDB_URL: ${IQDB_URL:?}
  SELENIUM_URL: ${SELENIUM_URL:?}
  SELENIUM_VNC_URL: ${SELENIUM_VNC_URL:?}
  VIPS_WARNING: ${VIPS_WARNING:?}

services:
  foxtrove:
    build:
      context: ./
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        DOCKER_RUN_AS_USER: ${DOCKER_RUN_AS_USER:-}
    image: foxtrove
    environment:
      <<: *common-env
      RAILS_SERVER_EXEC: bin/rails server -p 9000 -b 0.0.0.0 --pid /tmp/server.pid
      ESBUILD_EXEC: >-
        esbuild app/typescript/application.ts
        --target=chrome111,firefox111,safari16
        --bundle --sourcemap
        --outdir=public/build --loader:.png=file
        --entry-names=[name]-[hash] --metafile=public/build/manifest.json
        --watch=forever --color=true
      GOOD_JOB_EXEC: bundle exec good_job --queues=scraping:1;e6_iqdb:1;variant_generation:5;default:1;submission_download:5
    volumes:
      - .:/app
      - ${FOXTROVE_DATA_PATH:?}/active_storage:/app/public/storage
    depends_on:
      - postgres
    ports:
      - ${EXPOSED_SERVER_PORT:?}:9000
    command: foreman start --color

  postgres:
    image: postgres:${POSTGRES_IMAGE_VERSION:-18.6-alpine3.24}
    environment:
      - POSTGRES_USER=foxtrove
      - POSTGRES_DB=foxtrove_development
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ${FOXTROVE_DATA_PATH:?}/db_data:/var/lib/postgresql/data
    shm_size: 256mb
    ports:
      - ${EXPOSED_POSTGRES_PORT:?}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -d foxtrove_development -U foxtrove]
      interval: 10s
      timeout: 5s
      retries: 5

  iqdb:
    image: ghcr.io/earlopain/iqdb:a7ad6010291d5308e65b040b2c3a128ddfd5f3d3
    volumes:
      - ${FOXTROVE_DATA_PATH:?}/iqdb_data:/iqdb
  selenium:
    image: selenium/standalone-chrome:4.49.0-20260909
    environment:
      - SE_VNC_NO_PASSWORD=1
    shm_size: 2gb
    ports:
      - ${EXPOSED_SELENIUM_VNC_PORT:?}:7900
