services:
  foxtrove:
    build:
      context: ./
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        DOCKER_RUN_AS_USER: ${DOCKER_RUN_AS_USER:-}
    image: foxtrove
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      IQDB_URL: ${IQDB_URL:?}
      SELENIUM_URL: ${SELENIUM_URL:?}
      SELENIUM_VNC_URL: ${SELENIUM_VNC_URL:?}
      VIPS_WARNING: ${VIPS_WARNING:?}
      FOXTROVE_DATA_PATH: /data
    volumes:
      - .:/app
      - ${FOXTROVE_DATA_PATH:?}/active_storage:/data/active_storage
    depends_on:
      postgres:
        condition: ${POSTGRS_DEPENDS_CONDITION:-service_started}
    ports:
      - ${EXPOSED_SERVER_PORT:?}:9000
    command: bin/rails server -p 9000 -b 0.0.0.0 --pid /tmp/server.pid

  good_job:
    extends:
      service: foxtrove
    depends_on: !override
      postgres:
        condition: ${POSTGRES_DEPENDS_CONDITION:-service_started}
    ports: !reset []
    command: bundle exec good_job

  esbuild:
    extends:
      service: foxtrove
    depends_on: !reset []
    ports: !reset []
    command: >-
      esbuild app/typescript/application.ts public/icons/*.png
      --target=chrome111,firefox111,safari16
      --bundle --sourcemap
      --outdir=public/build --loader:.png=copy
      --entry-names=[name]-[hash] --metafile=public/build/manifest.json
      --watch=forever --color=true

  postgres:
    image: postgres:${POSTGRES_IMAGE_VERSION:-18.6-alpine3.24}
    environment:
      - POSTGRES_USER=foxtrove
      - POSTGRES_DB=foxtrove_development
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ${FOXTROVE_DATA_PATH:?}/db_data:/var/lib/postgresql/data
    shm_size: 256mb
    ports:
      - ${EXPOSED_POSTGRES_PORT:?}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -d foxtrove_development -U foxtrove]
      interval: 10s
      timeout: 5s
      retries: 5

  iqdb:
    image: ghcr.io/earlopain/iqdb:a7ad6010291d5308e65b040b2c3a128ddfd5f3d3
    volumes:
      - ${FOXTROVE_DATA_PATH:?}/iqdb_data:/iqdb
  selenium:
    image: selenium/standalone-chrome:4.49.0-20260909
    environment:
      - SE_VNC_NO_PASSWORD=1
    shm_size: 2gb
    ports:
      - ${EXPOSED_SELENIUM_VNC_PORT:?}:7900
