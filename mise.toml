[tools]
ruby = "4.0.7"
node = "24"
yamlfmt = "0.21.0"

[env]
_.file = ".env"
_.path = ["{{config_root}}/node_modules/.bin"]

FOXTROVE_DATA_PATH = { default = "./data" }
VIPS_WARNING = { default = "0" }

EXPOSED_SERVER_PORT = { default = "9000" }
EXPOSED_POSTGRES_PORT = { default = "34518" }
EXPOSED_IQDB_PORT = { default = "5588" }
EXPOSED_SELENIUM_PORT = { default = "4444" }
EXPOSED_SELENIUM_VNC_PORT = { default = "7900" }

DATABASE_URL = "postgresql://localhost:{{ env.EXPOSED_POSTGRES_PORT }}"
IQDB_URL = "http://localhost:{{ env.EXPOSED_IQDB_PORT }}"
SELENIUM_URL = "http://localhost:{{ env.EXPOSED_SELENIUM_PORT }}"
SELENIUM_VNC_URL = "http://localhost:{{ env.EXPOSED_SELENIUM_VNC_PORT }}"

[tasks."docker:start"]
description = "Bring up all the necessary docker containers"
run = "docker compose up foxtrove good_job esbuild iqdb selenium"

[tasks."docker:run"]
description = "Run a command in the docker container containing the rails application"
env.POSTGRS_DEPENDS_CONDITION = "service_healthy"
run = "docker compose run --rm foxtrove"

[tasks."docker:test"]
description = "Run rails tests in docker"
env.POSTGRS_DEPENDS_CONDITION = "service_healthy"
run = "docker compose run --rm foxtrove bin/rails test"

[tasks."docker"]
description = "Run a docker compose command"
run = "docker compose"

[tasks."local:bundle-install"]
description = "Keep local gem up-to-date"
run = "bundle install"
sources = ["Gemfile.lock", ".bundle/config"]

[tasks."local:npm-install"]
description = "Keep local npm packages up-to-date"
run = "npm install"
sources = ["package-lock.json"]

[tasks."local:start"]
description = "Start all required services in the background, run `bin/rails s` to start rails after"
run = "docker compose up postgres good_job esbuild iqdb selenium -d"

[tasks.lint]
description = "Run all linting tasks"
depends = ["lint:*"]

[tasks."lint:css"]
description = "Run stylelint"
depends = ["local:npm-install"]
run = "stylelint --config .github/.stylelintrc.json 'app/**/*.css'"

[tasks."lint:rb"]
description = "Run rubocop"
depends = ["local:bundle-install"]
run = "bundle exec rubocop"

[tasks."lint:ts"]
description = "Run typescript (tsc)"
depends = ["local:npm-install"]
run = "tsc --noEmit -p .github/tsconfig.json"

[tasks."lint:yaml"]
description = "Run yamlfmt"
run = "yamlfmt -lint -conf .github/yamlfmt.yml ."
